name: Android APK

on:
  push:
    branches:
      - main
      - android
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Android SDK
        run: test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

      - name: Extract source workspace
        run: |
          rm -rf app
          mkdir app
          unzip -q grok-workspace.zip -d app
          test -f app/package.json

      - name: Prepare Android build
        working-directory: app
        shell: bash
        run: |
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.dependencies={...p.dependencies,"@capacitor/core":"^8.0.0"};p.devDependencies={...p.devDependencies,"@capacitor/cli":"^8.0.0","@capacitor/android":"^8.0.0"};fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'
          node -e 'const fs=require("fs");let s=fs.readFileSync("vite.config.ts","utf8");if(!s.includes("spa: { enabled: process.env.CAPACITOR_BUILD === \\\"true\\\" }")){s=s.replace("tanstackStart(),","tanstackStart({ spa: { enabled: process.env.CAPACITOR_BUILD === \\\"true\\\" } }),");fs.writeFileSync("vite.config.ts",s)}'
          node -e 'const fs=require("fs");let s=fs.readFileSync("scripts/grok-pwa-shared.mjs","utf8");const a=`const fromSite = String(site.title ?? "").trim();\n  if (fromSite) return fromSite;\n  const fromDoc = String(documentTitle ?? "").trim();\n  if (fromDoc) return fromDoc;`;const b=`const fromDoc = String(documentTitle ?? "").trim();\n  if (fromDoc) return fromDoc;\n  const fromSite = String(site.title ?? "").trim();\n  if (fromSite) return fromSite;`;if(s.includes(a))fs.writeFileSync("scripts/grok-pwa-shared.mjs",s.replace(a,b))'
          printf '%s\n' 'import type { CapacitorConfig } from "@capacitor/cli";' '' 'const config: CapacitorConfig = {' '  appId: "ir.sahmban.app",' '  appName: "سهم‌بان",' '  webDir: ".output/public",' '  bundledWebRuntime: false,' '};' '' 'export default config;' > capacitor.config.ts
          printf '%s\n' 'import { copyFileSync, existsSync, mkdirSync } from "node:fs";' 'import { join } from "node:path";' '' 'const d=join(process.cwd(),".output","public");' 'const s=join(d,"_shell.html");' 'const i=join(d,"index.html");' 'if(!existsSync(s)) throw new Error(`TanStack Start SPA shell not found: ${s}`);' 'mkdirSync(d,{recursive:true});' 'copyFileSync(s,i);' > scripts/prepare-capacitor.mjs
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.scripts={...p.scripts,"build:android":"CAPACITOR_BUILD=true node scripts/with-app-env.mjs vite build && node scripts/prepare-capacitor.mjs"};fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: app
        run: npm run typecheck

      - name: Build web app
        working-directory: app
        run: npm run build:android

      - name: Add Capacitor Android
        working-directory: app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sahmban-debug-apk-${{ github.ref_name }}
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
